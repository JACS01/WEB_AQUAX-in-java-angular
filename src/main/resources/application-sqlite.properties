spring.datasource.url=${AQUAX_DATABASE_URL:jdbc:sqlite:aquax.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-sqlite.sql

# Mantiene las relaciones y serializa las transacciones que modifican los datos.
spring.datasource.hikari.data-source-properties.foreign_keys=true
spring.datasource.hikari.data-source-properties.busy_timeout=30000
spring.datasource.hikari.data-source-properties.transaction_mode=IMMEDIATE
