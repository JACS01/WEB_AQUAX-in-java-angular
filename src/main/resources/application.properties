spring.application.name=aquax-backend
spring.profiles.default=sqlite
spring.jpa.open-in-view=false
spring.mvc.problemdetails.enabled=true
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.datatype.enum.fail-on-numbers-for-enums=true
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50
aquax.jwt.secret-base64=${AQUAX_JWT_SECRET:}
aquax.jwt.expiration-seconds=${AQUAX_JWT_EXPIRATION_SECONDS:3600}
